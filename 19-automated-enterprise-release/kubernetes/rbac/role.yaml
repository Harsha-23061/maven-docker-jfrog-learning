apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enterprise-deployment-role
  namespace: enterprise-prod
  labels:
    app.kubernetes.io/part-of: enterprise-release
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get

  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
      - watch
