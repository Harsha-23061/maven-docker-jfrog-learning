name: Exercise 03 - Maven CI

on:
  push:
    branches: [main]
    paths:
      - '01-maven-docker-artifactory/**'
      - '.github/workflows/maven-ci.yml'
  pull_request:
    paths:
      - '01-maven-docker-artifactory/**'
      - '.github/workflows/maven-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-maven-docker-artifactory
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 01-maven-docker-artifactory/pom.xml
      - name: Build and run tests
        run: mvn -B -ntp clean verify
