name: Exercise 03 - JFrog Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jfrog-maven-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 01-maven-docker-artifactory
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 01-maven-docker-artifactory/pom.xml
      - name: Create unique CI release version
        shell: bash
        run: |
          VERSION="1.0.7-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "Publishing Maven version: $VERSION"
          mvn -B -ntp versions:set "-DnewVersion=$VERSION" -DgenerateBackupPoms=false
      - name: Build and verify
        run: mvn -B -ntp clean verify
      - name: Deploy to JFrog Artifactory
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$JFROG_USER" || -z "$JFROG_TOKEN" ]]; then
            echo "::error::JFROG_USER and JFROG_TOKEN secrets must be configured."
            exit 1
          fi
          cp .mvn/settings.xml.example .mvn/settings.xml
          chmod 600 .mvn/settings.xml
          mvn -B -ntp -s .mvn/settings.xml deploy -DskipTests
