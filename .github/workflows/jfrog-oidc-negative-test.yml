name: JFrog OIDC Negative Test
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  reject-unauthorized-workflow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Attempt OIDC exchange with official JFrog action
        id: jfrog
        continue-on-error: true
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://trialgccoro.jfrog.io
        with:
          oidc-provider-name: github-oidc
          oidc-audience: jfrog-github
          disable-auto-build-publish: true

      - name: Enforce failed exchange
        if: always()
        shell: bash
        env:
          STEP_OUTCOME: ${{ steps.jfrog.outcome }}
          OIDC_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          set -euo pipefail
          if [ "$STEP_OUTCOME" = success ] || [ -n "$OIDC_TOKEN" ]; then
            echo "FAIL: Unauthorized workflow successfully exchanged OIDC token"
            exit 1
          fi
          if [ "$STEP_OUTCOME" != failure ]; then
            echo "INCONCLUSIVE: OIDC action was not run or outcome unexpected: $STEP_OUTCOME"
            exit 1
          fi
          echo "PASS: JFrog setup action rejected unauthorized workflow"
          echo "NOTE: Inspect previous step's actual JFrog error before attributing denial to the workflow_ref claim"
