name: Enterprise CI Pipeline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 01-maven-docker-artifactory/pom.xml
      - name: Version, build and test once
        working-directory: 01-maven-docker-artifactory
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.7-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mvn -B -ntp versions:set "-DnewVersion=$VERSION" -DgenerateBackupPoms=false
          mvn -B -ntp clean verify
          test -f target/surefire-reports/TEST-com.example.MainTest.xml
          mkdir -p ../staging
          cp "target/maven-docker-artifactory-$VERSION.jar" ../staging/app.jar
          cp pom.xml ../staging/pom.xml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Record checksum and package tested JAR
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(sha256sum staging/app.jar | cut -d ' ' -f 1)
          echo "$SHA  app.jar" > staging/app.jar.sha256
          echo "JAR SHA-256: $SHA"
          IMAGE="enterprise-demo:$VERSION"
          docker build -f 15-enterprise-cicd/Dockerfile -t "$IMAGE" staging/
          CID=$(docker create "$IMAGE")
          trap 'docker rm "$CID" >/dev/null' EXIT
          docker cp "$CID:/app/app.jar" /tmp/container-app.jar
          test "$(sha256sum /tmp/container-app.jar | cut -d ' ' -f 1)" = "$SHA"
          echo "PASS: Container JAR matches tested Maven JAR"
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "10001:10001"
          echo "PASS: Non-root container configuration"
          printf 'Hello and welcome!\ni = 1\ni = 2\ni = 3\ni = 4\ni = 5\n' > /tmp/expected-output.txt
          docker run --rm "$IMAGE" > /tmp/actual-output.txt
          diff -u /tmp/expected-output.txt /tmp/actual-output.txt
          echo "PASS: Container smoke test"
      - name: Retain tested Maven artifact and evidence
        uses: actions/upload-artifact@v4
        with:
          name: tested-maven-${{ env.VERSION }}
          path: |
            staging/
            01-maven-docker-artifactory/target/surefire-reports/
          if-no-files-found: error
          retention-days: 7
