name: Enterprise CI Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 01-maven-docker-artifactory/pom.xml

      - name: Build Maven JAR and run unit tests
        run: bash 15-enterprise-cicd/pipeline.sh build

      - name: Package and test Docker image
        run: bash 15-enterprise-cicd/pipeline.sh docker

      - name: Publish Maven artifact to JFrog
        if: github.ref == 'refs/heads/main'
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: bash 15-enterprise-cicd/pipeline.sh maven-publish

      - name: Publish Docker image to JFrog
        if: github.ref == 'refs/heads/main'
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: bash 15-enterprise-cicd/pipeline.sh docker-publish

      - name: Save artifact and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: tested-maven-${{ env.VERSION }}
          path: |
            staging/
            01-maven-docker-artifactory/target/surefire-reports/
          if-no-files-found: error
          retention-days: 7
