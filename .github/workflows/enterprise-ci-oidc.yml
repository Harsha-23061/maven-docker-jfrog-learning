name: Enterprise CI Pipeline (OIDC)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 01-maven-docker-artifactory/pom.xml
      - name: Version, build and test once
        working-directory: 01-maven-docker-artifactory
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.7-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mvn -B -ntp versions:set "-DnewVersion=$VERSION" -DgenerateBackupPoms=false
          mvn -B -ntp clean verify
          test -f target/surefire-reports/TEST-com.example.MainTest.xml
          mkdir -p ../staging
          cp "target/maven-docker-artifactory-$VERSION.jar" ../staging/app.jar
          cp pom.xml ../staging/pom.xml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Record checksum and package tested JAR
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(sha256sum staging/app.jar | cut -d ' ' -f 1)
          echo "$SHA  app.jar" > staging/app.jar.sha256
          echo "JAR SHA-256: $SHA"
          IMAGE="enterprise-demo:$VERSION"
          docker build -f 15-enterprise-cicd/Dockerfile -t "$IMAGE" staging/
          CID=$(docker create "$IMAGE")
          trap 'docker rm "$CID" >/dev/null' EXIT
          docker cp "$CID:/app/app.jar" /tmp/container-app.jar
          test "$(sha256sum /tmp/container-app.jar | cut -d ' ' -f 1)" = "$SHA"
          echo "PASS: Container JAR matches tested Maven JAR"
          test "$(docker image inspect --format '{{.Config.User}}' "$IMAGE")" = "10001:10001"
          echo "PASS: Non-root container configuration"
          printf 'Hello and welcome!\ni = 1\ni = 2\ni = 3\ni = 4\ni = 5\n' > /tmp/expected-output.txt
          docker run --rm "$IMAGE" > /tmp/actual-output.txt
          diff -u /tmp/expected-output.txt /tmp/actual-output.txt
          echo "PASS: Container smoke test"
      - name: Set up JFrog CLI for Build Info
        if: github.ref == 'refs/heads/main'
        uses: jfrog/setup-jfrog-cli@v4
        id: jfrog
        env:
          JF_URL: https://trialgccoro.jfrog.io
        with:
          oidc-provider-name: github-oidc
          oidc-audience: jfrog-github
          disable-auto-build-publish: true
      - name: Publish and verify tested Maven artifact
        if: github.ref == 'refs/heads/main'
        env:
          JFROG_USER: ${{ steps.jfrog.outputs.oidc-user }}
          JFROG_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JFROG_USER"
          test -n "$JFROG_TOKEN"
          BASE="https://trialgccoro.jfrog.io/artifactory/libs-release-local"
          ARTIFACT="com/example/maven-docker-artifactory/$VERSION/maven-docker-artifactory-$VERSION"
          (cd staging && sha256sum -c app.jar.sha256)
          BUILD_NAME=enterprise-release-ci
          BUILD_NUMBER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$JFROG_USER" = maven-deployer
          echo "PASS: Restricted OIDC identity verified"
          jf rt upload staging/app.jar "libs-release-local/$ARTIFACT.jar" --flat=true --fail-no-op=true --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --module=maven-docker-artifactory --server-id=setup-jfrog-cli-server
          jf rt upload staging/pom.xml "libs-release-local/$ARTIFACT.pom" --flat=true --fail-no-op=true --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --module=maven-docker-artifactory --server-id=setup-jfrog-cli-server
          curl --fail --silent --show-error --max-time 60 --user "$JFROG_USER:$JFROG_TOKEN" "$BASE/$ARTIFACT.jar" -o /tmp/jfrog-app.jar
          curl --fail --silent --show-error --max-time 60 --user "$JFROG_USER:$JFROG_TOKEN" "$BASE/$ARTIFACT.pom" -o /tmp/jfrog-app.pom
          cmp staging/app.jar /tmp/jfrog-app.jar
          cmp staging/pom.xml /tmp/jfrog-app.pom
          echo "PASS: Published Maven JAR and POM match staged files"
          echo "JFrog JAR SHA-256: $(sha256sum /tmp/jfrog-app.jar | cut -d ' ' -f 1)"
          echo "Published Maven version: $VERSION"
      - name: Publish and verify tested Docker image
        if: github.ref == 'refs/heads/main'
        env:
          JFROG_USER: ${{ steps.jfrog.outputs.oidc-user }}
          JFROG_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JFROG_USER"
          test -n "$JFROG_TOKEN"
          REGISTRY=trialgccoro.jfrog.io
          REPO="$REGISTRY/docker-trial/enterprise-demo"
          IMAGE="$REPO:$VERSION"
          printf '%s' "$JFROG_TOKEN" | docker login "$REGISTRY" --username "$JFROG_USER" --password-stdin
          trap 'docker logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          docker tag "enterprise-demo:$VERSION" "$IMAGE"
          docker push "$IMAGE" | tee /tmp/enterprise-push.log
          DIGEST=$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64}).*/\1/p' /tmp/enterprise-push.log | tail -n 1)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          REF="$REPO@$DIGEST"
          docker pull "$REF"
          test "$(docker image inspect --format '{{.Id}}' "$REF")" = "$(docker image inspect --format '{{.Id}}' "enterprise-demo:$VERSION")"
          CID=$(docker create "$REF")
          trap 'docker rm "$CID" >/dev/null 2>&1 || true; docker logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID:/app/app.jar" /tmp/registry-app.jar
          cmp staging/app.jar /tmp/registry-app.jar
          printf '%s\n' "$REF" > staging/docker-image-ref.txt
          echo "PASS: Registry image matches tested local image and Maven JAR"
          echo "Published Docker image: $IMAGE"
          echo "Registry image digest: $DIGEST"
      - name: Collect Docker and publish combined Build Info
        if: github.ref == 'refs/heads/main'
        env:
          JFROG_USER: ${{ steps.jfrog.outputs.oidc-user }}
          JFROG_TOKEN: ${{ steps.jfrog.outputs.oidc-token }}
        run: |
          set -euo pipefail
          BUILD_NAME=enterprise-release-ci
          BUILD_NUMBER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REF=$(cat staging/docker-image-ref.txt)
          printf '%s:%s@%s\n' "${REF%@*}" "$VERSION" "${REF##*@}" > /tmp/image-file-details.txt
          jf rt build-docker-create docker-trial --image-file=/tmp/image-file-details.txt --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --server-id=setup-jfrog-cli-server --module=enterprise-demo
          jf rt build-publish "$BUILD_NAME" "$BUILD_NUMBER" --server-id=setup-jfrog-cli-server
          jf rt curl -XGET "/api/build/$BUILD_NAME/$BUILD_NUMBER" --server-id=setup-jfrog-cli-server > staging/build-info.json
          jq -e 'any(.buildInfo.modules[]?; .type == "docker" and .id == "enterprise-demo" and ((.artifacts // []) | length > 0))' staging/build-info.json
          echo "PASS: Published Docker Build Info contains image artifacts"
          JAR_SHA=$(sha256sum staging/app.jar | cut -d " " -f 1)
          POM_SHA=$(sha256sum staging/pom.xml | cut -d " " -f 1)
          jq -e --arg jar "$JAR_SHA" --arg pom "$POM_SHA" 'any(.buildInfo.modules[]?; .id == "maven-docker-artifactory" and any(.artifacts[]?; .sha256 == $jar) and any(.artifacts[]?; .sha256 == $pom))' staging/build-info.json
          echo "PASS: Combined Build Info contains tested Maven JAR and POM"
      - name: Enforce Xray severity security gate
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          jf build-scan "enterprise-release-ci" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --fail=true --vuln=true --format=json --server-id=setup-jfrog-cli-server > staging/xray-scan.json
          jq -e 'type == "array" and length > 0 and all(.[]; type == "object" and (.xray_data_url | type == "string" and length > 0) and (.vulnerabilities | type == "array") and all(.vulnerabilities[]; type == "object" and (.severity == "Critical" or .severity == "High" or .severity == "Medium" or .severity == "Low")))' staging/xray-scan.json >/dev/null
          BLOCKING=$(jq '[.[].vulnerabilities[] | select(.severity == "Critical" or .severity == "High")] | length' staging/xray-scan.json)
          if (( BLOCKING > 0 )); then
            echo "BLOCKED: $BLOCKING High/Critical vulnerabilities"
            exit 1
          fi
          echo "PASS: Xray severity gate passed"
      - name: Retain tested Maven artifact and evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: tested-maven-${{ env.VERSION }}
          path: |
            staging/
            01-maven-docker-artifactory/target/surefire-reports/
          if-no-files-found: error
          retention-days: 7
