name: Exercise 04 - Docker JFrog Push

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jfrog-docker-push
  cancel-in-progress: false

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        shell: bash
        run: |
          IMAGE="trialgccoro.jfrog.io/docker-trial/maven-docker-demo:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --file 04-docker-cicd/Dockerfile --tag "$IMAGE" 01-maven-docker-artifactory
      - name: Log in to JFrog Docker registry
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$JFROG_USER" || -z "$JFROG_TOKEN" ]]; then
            echo "::error::JFROG_USER and JFROG_TOKEN secrets are required."
            exit 1
          fi
          printf '%s' "$JFROG_TOKEN" | docker login trialgccoro.jfrog.io --username "$JFROG_USER" --password-stdin
      - name: Push Docker image to JFrog
        run: docker push "$IMAGE"
      - name: Log out of JFrog Docker registry
        if: always()
        run: docker logout trialgccoro.jfrog.io || true
