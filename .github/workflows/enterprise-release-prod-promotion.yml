
          echo "Expected JAR: $EXPECTED_JAR_SHA256"
          echo "Actual JAR:   $ACTUAL_JAR_SHA256"

          test "$ACTUAL_JAR_SHA256" = "$EXPECTED_JAR_SHA256"

          echo "PASS: Production JAR checksum"

          echo "Expected POM: $EXPECTED_POM_SHA256"
          echo "Actual POM:   $ACTUAL_POM_SHA256"

          test "$ACTUAL_POM_SHA256" = "$EXPECTED_POM_SHA256"

          echo "PASS: Production POM checksum"

      - name: Verify production Docker integrity
        env:
          JFROG_USER: ${{ secrets.JFROG_PROD_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_PROD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY="${JFROG_URL#https://}"
          IMAGE="$REGISTRY/docker-prod-local/enterprise-demo:$ARTIFACT_VERSION"

          trap 'docker logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT

          printf '%s' "$JFROG_TOKEN" | docker login "$REGISTRY" \
            --username "$JFROG_USER" \
            --password-stdin

          docker buildx imagetools inspect "$IMAGE" \
            > evidence/prod-docker-inspect.txt

          ACTUAL_DIGEST=$(awk '$1 == "Digest:" {print $2; exit}' \
            evidence/prod-docker-inspect.txt)

          echo "Expected Docker Digest: $EXPECTED_DOCKER_DIGEST"
          echo "Actual Docker Digest:   $ACTUAL_DIGEST"

          test "$ACTUAL_DIGEST" = "$EXPECTED_DOCKER_DIGEST"

          echo "PASS: Production Docker digest"

      - name: Generate production release evidence
        env:
          QA_RUN_ID: ${{ inputs.qa_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg bundle "$RELEASE_BUNDLE_NAME" \
            --arg version "$RELEASE_VERSION" \
            --arg build "$BUILD_NUMBER" \
            --arg artifact "$ARTIFACT_VERSION" \
            --arg jar "$EXPECTED_JAR_SHA256" \
            --arg pom "$EXPECTED_POM_SHA256" \
            --arg docker "$EXPECTED_DOCKER_DIGEST" \
            --arg qa_run "$QA_RUN_ID" \
            --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              release_bundle: $bundle,
              release_version: $version,
              build_number: $build,
              artifact_version: $artifact,
              environment: "PROD",
              qa_validation: "PASSED",
              security_gate: "PASSED",
              promotion: "PASSED",
              integrity_validation: "PASSED",
              jar_sha256: $jar,
              pom_sha256: $pom,
              docker_digest: $docker,
              qa_run_id: $qa_run,
              github_run_id: $run,
              github_run_attempt: $attempt
            }' > evidence/prod-validation.json

          cat evidence/prod-validation.json

      - name: Upload production release evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Generate production release summary
        shell: bash
        run: |
          {
            echo "## Enterprise Production Release"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Release Bundle | $RELEASE_BUNDLE_NAME |"
            echo "| Release Version | $RELEASE_VERSION |"
            echo "| Build Number | $BUILD_NUMBER |"
            echo "| QA Validation | PASSED |"
            echo "| Xray Security Gate | PASSED |"
            echo "| Production Promotion | PASSED |"
            echo "| Maven JAR Integrity | PASSED |"
            echo "| Maven POM Integrity | PASSED |"
            echo "| Docker Image Integrity | PASSED |"
            echo "| Release Status | PROMOTED |"
            echo ""
            echo "Kubernetes deployment is not part of this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup production configuration
        if: always()
        run: jf config remove jfrog-prod --quiet || true
