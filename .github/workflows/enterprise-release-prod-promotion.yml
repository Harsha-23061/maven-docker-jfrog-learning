
name: Phase 19 - Enterprise Production Promotion

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Validated QA Release Bundle version
        required: true
        type: string
        default: '1.0.8'

      qa_run_id:
        description: Successful QA promotion run ID
        required: true
        type: string
        default: '45824284048'

permissions:
  contents: read
  actions: read

concurrency:
  group: enterprise-release-${{ inputs.release_version }}
  cancel-in-progress: false

env:
  JFROG_URL: https://trialgccoro.jfrog.io
  RELEASE_BUNDLE_NAME: enterprise-demo-release
  BUILD_NAME: enterprise-release-ci
  BUILD_NUMBER: '45636994469-1'
  ARTIFACT_VERSION: '1.0.7-ci-45636994469-1'

  EXPECTED_JAR_SHA256: '84402355a1defeca3e5b9ff2ce64949692cf95c5879ae789741dc50d80c2d3b3'
  EXPECTED_POM_SHA256: '38a9aa015ab72e6f997def9e135de50ec255b2dffad445c12830442bd3134446'
  EXPECTED_DOCKER_DIGEST: 'sha256:802449680bbc5d323689ee1dcb8081367f662af7d948d451ee8d9b6ac2d2f3b3'

jobs:

  verify-qa:
    name: Verify QA Promotion and Evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      release_version: ${{ steps.verify.outputs.release_version }}

    steps:
      - name: Verify successful QA run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RUN_ID: ${{ inputs.qa_run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$QA_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          test "$QA_RUN_ID" = "45824284048"
          test "$RELEASE_VERSION" = "1.0.8"

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$QA_RUN_ID" \
            > qa-run.json

          jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            '
            .status == "completed" and
            .conclusion == "success" and
            .head_branch == "main" and
            .head_repository.full_name == $repo and
            .run_attempt == 1 and
            .path == ".github/workflows/enterprise-release-qa-promotion.yml"
            ' qa-run.json

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

          echo "PASS: QA workflow verification"

      - name: Download QA validation evidence
        uses: actions/download-artifact@v4
        with:
          name: qa-release-evidence-${{ inputs.qa_run_id }}-1
          run-id: ${{ inputs.qa_run_id }}
          github-token: ${{ github.token }}
          path: qa-evidence

      - name: Validate QA release evidence
        env:
          QA_RUN_ID: ${{ inputs.qa_run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          test -f qa-evidence/qa-validation.json

          jq -e \
            --arg bundle "$RELEASE_BUNDLE_NAME" \
            --arg version "$RELEASE_VERSION" \
            --arg build "$BUILD_NUMBER" \
            --arg artifact "$ARTIFACT_VERSION" \
            --arg jar "$EXPECTED_JAR_SHA256" \
            --arg pom "$EXPECTED_POM_SHA256" \
            --arg docker "$EXPECTED_DOCKER_DIGEST" \
            --arg run "$QA_RUN_ID" \
            '
            .release_bundle == $bundle and
            .release_version == $version and
            .build_number == $build and
            .artifact_version == $artifact and
            .environment == "QA" and
            .promotion == "PASSED" and
            .integrity_validation == "PASSED" and
            .jar_sha256 == $jar and
            .pom_sha256 == $pom and
            .docker_digest == $docker and
            .github_run_id == $run
            ' qa-evidence/qa-validation.json

          echo "PASS: QA release evidence verification"

  security-gate:
    name: Production Xray Security Gate
    needs: verify-qa
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20

    steps:
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          version: '2.77.0'
          disable-auto-build-publish: true

      - name: Configure security scan authentication
        env:
          JFROG_USER: ${{ secrets.JFROG_DEV_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_DEV_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$JFROG_USER"
          test -n "$JFROG_TOKEN"
          test "$JFROG_USER" = "maven-deployer"

          jf config add jfrog-dev \
            --url="$JFROG_URL" \
            --user="$JFROG_USER" \
            --access-token="$JFROG_TOKEN" \
            --interactive=false

          jf rt ping --server-id=jfrog-dev

      - name: Execute fresh Xray build scan
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p security-evidence

          jf build-scan "$BUILD_NAME" "$BUILD_NUMBER" \
            --server-id=jfrog-dev \
            --fail=true \
            --vuln=true \
            --format=json \
            > security-evidence/xray-scan.json

          jq -e '
            type == "object" and
            (.vulnerabilities | type == "array") and
            all(.vulnerabilities[];
              (.severity | type == "string")
            )
          ' security-evidence/xray-scan.json

          BLOCKING_COUNT=$(jq '
            [
              .vulnerabilities[] |
              select(
                (.severity | ascii_downcase) == "critical" or
                (.severity | ascii_downcase) == "high"
              )
            ] | length
          ' security-evidence/xray-scan.json)

          echo "High/Critical vulnerabilities: $BLOCKING_COUNT"

          test "$BLOCKING_COUNT" -eq 0

          echo "PASS: Production Xray security gate"

      - name: Upload Xray security evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: production-security-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Cleanup scan configuration
        if: always()
        run: jf config remove jfrog-dev --quiet || true

  promote-production:
    name: Approve and Promote Production
    needs:
      - verify-qa
      - security-gate

    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    env:
      RELEASE_VERSION: ${{ needs.verify-qa.outputs.release_version }}

    steps:
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          version: '2.77.0'
          disable-auto-build-publish: true

      - name: Configure production authentication
        env:
          JFROG_USER: ${{ secrets.JFROG_PROD_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_PROD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$JFROG_USER"
          test -n "$JFROG_TOKEN"
          test "$JFROG_USER" = "prod-promoter"

          jf config add jfrog-prod \
            --url="$JFROG_URL" \
            --user="$JFROG_USER" \
            --access-token="$JFROG_TOKEN" \
            --interactive=false

          jf rt ping --server-id=jfrog-prod

          echo "PASS: Production authentication"

      - name: Verify production repository access
        shell: bash
        run: |
          set -euo pipefail

          for repo in maven-prod-local docker-prod-local; do
            jf rt curl -f -XGET \
              "/api/storage/$repo" \
              --server-id=jfrog-prod > /dev/null

            echo "PASS: Read access to $repo"
          done

      - name: Promote Release Bundle to PROD
        shell: bash
        run: |
          set -euo pipefail

          jf rbp "$RELEASE_BUNDLE_NAME" "$RELEASE_VERSION" PROD \
            --server-id=jfrog-prod \
            --promotion-type=copy \
            --sync=true

          echo "PASS: Production promotion"

      - name: Verify production Maven integrity
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p evidence

          MAVEN_PATH="com/example/maven-docker-artifactory/$ARTIFACT_VERSION"
          ARTIFACT_NAME="maven-docker-artifactory-$ARTIFACT_VERSION"

          jf rt curl -f -XGET \
            "/api/storage/maven-prod-local/$MAVEN_PATH/$ARTIFACT_NAME.jar" \
            --server-id=jfrog-prod > evidence/prod-jar.json

          jf rt curl -f -XGET \
            "/api/storage/maven-prod-local/$MAVEN_PATH/$ARTIFACT_NAME.pom" \
            --server-id=jfrog-prod > evidence/prod-pom.json

          ACTUAL_JAR_SHA256=$(jq -er '.checksums.sha256' evidence/prod-jar.json)
          ACTUAL_POM_SHA256=$(jq -er '.checksums.sha256' evidence/prod-pom.json)

          echo "Expected JAR: $EXPECTED_JAR_SHA256"
          echo "Actual JAR:   $ACTUAL_JAR_SHA256"

          test "$ACTUAL_JAR_SHA256" = "$EXPECTED_JAR_SHA256"

          echo "PASS: Production JAR checksum"

          echo "Expected POM: $EXPECTED_POM_SHA256"
          echo "Actual POM:   $ACTUAL_POM_SHA256"

          test "$ACTUAL_POM_SHA256" = "$EXPECTED_POM_SHA256"

          echo "PASS: Production POM checksum"

      - name: Verify production Docker integrity
        env:
          JFROG_USER: ${{ secrets.JFROG_PROD_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_PROD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY="${JFROG_URL#https://}"
          IMAGE="$REGISTRY/docker-prod-local/enterprise-demo:$ARTIFACT_VERSION"

          trap 'docker logout "$REGISTRY" >/dev/null 2>&1 || true' EXIT

          printf '%s' "$JFROG_TOKEN" | docker login "$REGISTRY" \
            --username "$JFROG_USER" \
            --password-stdin

          docker buildx imagetools inspect "$IMAGE" \
            > evidence/prod-docker-inspect.txt

          ACTUAL_DIGEST=$(awk '$1 == "Digest:" {print $2; exit}' \
            evidence/prod-docker-inspect.txt)

          echo "Expected Docker Digest: $EXPECTED_DOCKER_DIGEST"
          echo "Actual Docker Digest:   $ACTUAL_DIGEST"

          test "$ACTUAL_DIGEST" = "$EXPECTED_DOCKER_DIGEST"

          echo "PASS: Production Docker digest"

      - name: Generate production release evidence
        env:
          QA_RUN_ID: ${{ inputs.qa_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          jq -n \
            --arg bundle "$RELEASE_BUNDLE_NAME" \
            --arg version "$RELEASE_VERSION" \
            --arg build "$BUILD_NUMBER" \
            --arg artifact "$ARTIFACT_VERSION" \
            --arg jar "$EXPECTED_JAR_SHA256" \
            --arg pom "$EXPECTED_POM_SHA256" \
            --arg docker "$EXPECTED_DOCKER_DIGEST" \
            --arg qa_run "$QA_RUN_ID" \
            --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              release_bundle: $bundle,
              release_version: $version,
              build_number: $build,
              artifact_version: $artifact,
              environment: "PROD",
              qa_validation: "PASSED",
              security_gate: "PASSED",
              promotion: "PASSED",
              integrity_validation: "PASSED",
              jar_sha256: $jar,
              pom_sha256: $pom,
              docker_digest: $docker,
              qa_run_id: $qa_run,
              github_run_id: $run,
              github_run_attempt: $attempt
            }' > evidence/prod-validation.json

          cat evidence/prod-validation.json

      - name: Upload production release evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Generate production release summary
        shell: bash
        run: |
          {
            echo "## Enterprise Production Release"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Release Bundle | $RELEASE_BUNDLE_NAME |"
            echo "| Release Version | $RELEASE_VERSION |"
            echo "| Build Number | $BUILD_NUMBER |"
            echo "| QA Validation | PASSED |"
            echo "| Xray Security Gate | PASSED |"
            echo "| Production Promotion | PASSED |"
            echo "| Maven JAR Integrity | PASSED |"
            echo "| Maven POM Integrity | PASSED |"
            echo "| Docker Image Integrity | PASSED |"
            echo "| Release Status | PROMOTED |"
            echo ""
            echo "Kubernetes deployment is not part of this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup production configuration
        if: always()
        run: jf config remove jfrog-prod --quiet || true
